<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythm · Cockpit</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0d0f14;
    --surface:  #151820;
    --border:   #242838;
    --muted:    #3a3f52;
    --text:     #c8cfe0;
    --dim:      #5a6080;
    --accent:   #4e7cff;
    --green:    #3ecf8e;
    --yellow:   #f0c040;
    --red:      #f04060;
    --orange:   #f07840;
    --purple:   #9060f0;
    --mono:     'JetBrains Mono', 'Fira Mono', 'Courier New', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Layout ─────────────────────────────────────────────────────────────── */

  header {
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .04em;
    color: #fff;
  }

  header .badge {
    font-size: 10px;
    background: var(--muted);
    color: var(--dim);
    padding: 2px 7px;
    border-radius: 99px;
    letter-spacing: .06em;
  }

  header .as-of {
    margin-left: auto;
    font-size: 11px;
    color: var(--dim);
  }

  main {
    padding: 20px 24px;
    display: grid;
    gap: 20px;
  }

  /* ── Metric strip ───────────────────────────────────────────────────────── */

  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
  }

  .metric {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }

  .metric .label { font-size: 10px; color: var(--dim); letter-spacing: .07em; text-transform: uppercase; }
  .metric .value { font-size: 22px; font-weight: 700; font-family: var(--mono); color: #fff; margin-top: 4px; }
  .metric .sub   { font-size: 11px; color: var(--dim); margin-top: 2px; }

  .metric.highlight { border-color: var(--accent); }
  .metric.ok        { border-color: var(--green); }
  .metric.warn      { border-color: var(--yellow); }

  /* ── Progress bar ───────────────────────────────────────────────────────── */

  .progress-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .bar { flex: 1; height: 4px; background: var(--muted); border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
  .bar-pct { font-size: 10px; font-family: var(--mono); color: var(--dim); min-width: 36px; text-align: right; }

  /* ── Section headers ────────────────────────────────────────────────────── */

  .section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .section-head h2 {
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--dim);
    font-weight: 600;
  }

  .section-head .count {
    font-size: 10px;
    background: var(--muted);
    color: var(--dim);
    padding: 1px 6px;
    border-radius: 99px;
  }

  /* ── Tables ─────────────────────────────────────────────────────────────── */

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th {
    font-size: 10px;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--dim);
    font-weight: 600;
    padding: 8px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }

  tr:hover td { background: rgba(255,255,255,.02); }

  .mono { font-family: var(--mono); font-size: 12px; }

  /* ── Status chips ───────────────────────────────────────────────────────── */

  .chip {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .05em;
    padding: 2px 7px;
    border-radius: 99px;
    text-transform: uppercase;
  }

  .chip-green   { background: rgba(62,207,142,.12); color: var(--green); }
  .chip-yellow  { background: rgba(240,192,64,.12);  color: var(--yellow); }
  .chip-red     { background: rgba(240,64,96,.12);   color: var(--red); }
  .chip-orange  { background: rgba(240,120,64,.12);  color: var(--orange); }
  .chip-purple  { background: rgba(144,96,240,.12);  color: var(--purple); }
  .chip-blue    { background: rgba(78,124,255,.12);  color: var(--accent); }
  .chip-dim     { background: var(--muted);          color: var(--dim); }

  /* ── Pending panel ──────────────────────────────────────────────────────── */

  .pending-list { list-style: none; }

  .pending-list li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }

  .pending-list li:last-child { border-bottom: none; }

  .pending-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--yellow);
    margin-top: 5px;
    flex-shrink: 0;
  }

  .pending-dot.blocker { background: var(--red); }

  /* ── Notes / dim text ───────────────────────────────────────────────────── */

  .note { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .name-cell { font-weight: 500; color: #e0e4f0; }
  .alias { font-size: 11px; color: var(--dim); }
  .entities { font-size: 11px; color: var(--dim); }

  /* ── Paused billing warning ─────────────────────────────────────────────── */

  .billing-paused {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--orange);
    background: rgba(240,120,64,.1);
    border: 1px solid rgba(240,120,64,.25);
    border-radius: 4px;
    padding: 2px 6px;
    margin-top: 3px;
  }

  /* ── Fee cell ───────────────────────────────────────────────────────────── */

  .fee-cell { font-family: var(--mono); }
  .fee-est  { font-size: 10px; color: var(--dim); }

  /* ── Two-column layout ──────────────────────────────────────────────────── */

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <h1>Rhythm · Cockpit</h1>
  <span class="badge">SEED DATA</span>
  <span class="as-of">Parsed data report · June 10, 2026 · Fees: Jan/Feb vintage — verify before use</span>
</header>

<main>

  <!-- ── Metric strip ─────────────────────────────────────────────────────── -->

  <div class="metrics" id="metrics"></div>

  <!-- ── Clients + Team side by side ─────────────────────────────────────── -->

  <div>
    <div class="section-head">
      <h2>Client Roster</h2>
      <span class="count" id="client-count"></span>
    </div>
    <div class="card">
      <table id="client-table">
        <thead>

            <th>Fee / mo</th>
            <th>AM</th>
            <th>Production</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="two-col">
    <div>
      <div class="section-head">
        <h2>Team</h2>
        <span class="count" id="team-count"></span>
      </div>
      <div class="card">
        <table id="team-table">

            <tr>
              <th>Name</th>
              <th>Role</th>
              <th>Type</th>
              <th>Pay</th>

          </thead>

        </table>
      </div>
    </div>

    <div>
      <div class="section-head">
        <h2>Pending — §5 List</h2>
      </div>
      <div class="card">
        <ul class="pending-list" id="pending-list"></ul>
      </div>

      <div style="margin-top:20px">
        <div class="section-head"><h2>Locked Decisions</h2></div>
        <div class="card">
          <ul class="pending-list" id="decisions-list"></ul>
        </div>
      </div>
    </div>
  </div>

</main>

  { id:'brandon-rost-bemarketing',name:'Brandon Rost / BeMarketing',fee:5000,  billing:null,am:'paul-kartelias',prod:[],                                    status:'active',   churn:null, note:'Ad mgmt' },

  { id:'timepiece',              name:'Timepiece',                 fee:null,   billing:null,am:null,            prod:['austin'],                            status:'active',   churn:null, note:'In PM doc; status unclear' },

  { text:'Pay rates + real weekly availability for everyone except Austin ($17/hr), Dustin ($500/wk), Matt ($10K/mo). Pull Kaitlyn\'s rate from hours-tracker.', blocker:false },
  { text:'Current (June) fee per client — all figures are Jan/Feb vintage, stale.', blocker:false },

  { text:'Production owner for most Paul accounts.', blocker:false },

const DECISIONS = [
  { text:'Deemed-approval timer: 96 hours (4 calendar days). Calendar-based, not business-days. Supersedes SOP 5 v1.1. Follow-up: SOP 5 v1.2 + Matt sign-off needed.' },
  { text:'Fuge SOW unavailable for now. SOW fields are provisional from BUILD BRIEF §4.' },

  { text:'All fees flagged as estimate (Jan/Feb vintage) — verify at seed time.' },
];

// ── Helpers ──────────────────────────────────────────────────────────────────

const teamById = Object.fromEntries(TEAM.map(t => [t.id, t]));

function fmt(n) {
  if (n == null) return '<span style="color:var(--dim)">⏳</span>';
  return '$' + n.toLocaleString();
}

function statusChip(status, billingPaused, churn) {
  if (billingPaused) return '<span class="chip chip-orange">Paused</span>';
  if (churn === 'high') return '<span class="chip chip-red">Churn Risk</span>';
  const map = {
    active:   'chip-green',
    pending:  'chip-yellow',
    paused:   'chip-orange',
    complete: 'chip-dim',
    campaign: 'chip-blue',
  };
  const labels = {
    active:'Active', pending:'Pending', paused:'Paused', complete:'Complete', campaign:'Campaign'
  };
  return `<span class="chip ${map[status]||'chip-dim'}">${labels[status]||status}</span>`;
}

function typeChip(type) {
  if (!type) return '<span style="color:var(--dim)">⏳</span>';
  const map = { FTEmployee:'chip-green', Founder:'chip-purple', Contractor:'chip-yellow', PT:'chip-blue', Freelance:'chip-orange', ProjectBased:'chip-dim' };
  const labels = { FTEmployee:'FT Emp', Founder:'Founder', Contractor:'Contractor', PT:'PT', Freelance:'Freelance', ProjectBased:'Project' };
  return `<span class="chip ${map[type]||'chip-dim'}">${labels[type]||type}</span>`;
}

function roleChip(appRole) {
  const map = { Leadership:'chip-purple', AccountManager:'chip-blue', Team:'chip-dim' };
  return `<span class="chip ${map[appRole]||'chip-dim'}">${appRole}</span>`;
}

function prodNames(ids) {
  if (!ids || !ids.length) return '<span style="color:var(--dim)">⏳</span>';
  return ids.map(id => teamById[id]?.name || id).join(', ');
}

function amName(id) {
  if (!id) return '<span style="color:var(--dim)">⏳</span>';
  return teamById[id]?.name || id;
}

// ── Render metrics ────────────────────────────────────────────────────────────

const goal   = CONFIG.monthlyGoal;
const pct    = Math.round((booked / goal) * 100);
const netEst = booked - CONFIG.personnelBase - CONFIG.platformBase;
const marginEst = netEst / booked;

    <div class="value">${fmt(goal)}</div>
    <div class="sub">FY2026 target</div>
  </div>

    <div class="progress-row">
      <div class="bar"><div class="bar-fill" style="width:${Math.min(pct,100)}%"></div></div>

    </div>

  </div>

  <div class="metric">

    <div class="sub">of goal = ${fmt(Math.round(goal * CONFIG.hiringTriggerPct))}</div>
  </div>
  <div class="metric">
    <div class="label">Deemed Approval</div>
    <div class="value">${CONFIG.deemedApprovalHours}h</div>
    <div class="sub">4 calendar days · locked 6/10</div>
  </div>
  <div class="metric">
    <div class="label">Revision Cap</div>
    <div class="value">${CONFIG.revisionCap}</div>

  </div>
`;

// ── Render client table ───────────────────────────────────────────────────────

document.getElementById('client-count').textContent = `${activeClients.length} active / ${CLIENTS.length} total`;

const ctbody = document.querySelector('#client-table tbody');

  const feeCell = c.campaign
    ? `<div class="fee-cell">Campaign</div><div class="fee-est">${fmt(c.remaining)} remaining</div>`

  const aliasHtml = c.aliases ? `<div class="alias">${c.aliases.join(' · ')}</div>` : '';

  const noteHtml = c.note ? `<div class="note">${c.note}</div>` : '';

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <div class="name-cell">${c.name}</div>
      ${aliasHtml}${entitiesHtml}${pausedHtml}
    </td>
    <td>${feeCell}${adHtml}</td>
    <td>${amName(c.am)}</td>
    <td>${prodNames(c.prod)}</td>
    <td>${statusChip(c.status, c.billingPaused, c.churn)}${noteHtml}</td>
  `;
  ctbody.appendChild(tr);
});

// ── Render team table ─────────────────────────────────────────────────────────

TEAM.forEach(m => {
  const payDisplay = m.pay
    ? `<span class="mono">${m.pay}</span>`
    : '<span style="color:var(--dim)">⏳</span>';
  const redlined = m.redlined ? '<span class="chip chip-red" style="margin-left:4px">Redlined</span>' : '';
  const note = m.note ? `<div class="note">${m.note}</div>` : '';

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <div class="name-cell">${m.name}${redlined}</div>
      ${note}
    </td>
    <td>${m.role}</td>
    <td>${typeChip(m.type)} ${roleChip(m.appRole)}</td>
    <td>${payDisplay}</td>
  `;
  ttbody.appendChild(tr);
});

// ── Render pending items ──────────────────────────────────────────────────────

const pl = document.getElementById('pending-list');
PENDING.forEach(p => {
  const li = document.createElement('li');
  li.innerHTML = `<div class="pending-dot ${p.blocker ? 'blocker' : ''}"></div><div>${p.text}</div>`;
  pl.appendChild(li);
});

// ── Render locked decisions ───────────────────────────────────────────────────

const dl = document.getElementById('decisions-list');
DECISIONS.forEach(d => {
  const li = document.createElement('li');
  li.innerHTML = `<div class="pending-dot" style="background:var(--green)"></div><div>${d.text}</div>`;
  dl.appendChild(li);
});
</script>
</body>
</html>
